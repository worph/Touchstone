# Dev stack for Touchstone.
#
# Why this exists rather than just `yarn dev`: the claude-code container runs with
# `network_mode: host`, which on Docker Desktop means the Linux VM's network, not
# Windows. A dev server started inside it binds a port the host browser cannot see.
# Publishing ports from a container is what makes them reachable at Windows
# localhost, so dev runs here.
#
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f
#   docker compose -f docker-compose.dev.yml down
#
# This file is for development only. Production packaging is the AppShield sidecar
# stack described in ARCHITECTURE.md § Packaging, and is a separate file.

name: touchstone-dev

services:
  dev:
    # `node:22` plus `jq`, which is not a preference — `data/protocols/currency.sh` shells out
    # to it thirty times and refuses to run without it, so on the stock image the `currency`
    # reading was recorded `blocked` on every single run. That costs nothing (invariant 12: a
    # `scores: false` section is invisible to the hallmark) which is exactly why it went
    # unnoticed: nothing in the verdicts changes, the reading simply never happens.
    #
    # Baked into a layer rather than installed in `command:`, so a restart stays instant and an
    # `up` with no network works once it is cached.
    build:
      dockerfile_inline: |
        FROM node:22
        RUN apt-get update \
         && apt-get install -y --no-install-recommends jq \
         && rm -rf /var/lib/apt/lists/*
    container_name: touchstone-dev
    working_dir: /app
    volumes:
      # Windows-style source path, matching the convention already used by
      # claude-code-container/docker-compose.yml (`d:/workspace:/d/workspace`) —
      # the daemon is Docker Desktop and resolves drive-letter paths, not the
      # /d/... view that exists only inside the claude-code container.
      - d:/workspace/sandbox/Touchstone:/app
    ports:
      - "5173:5173" # Vite dev server — the UI
      - "8081:8081" # Fastify API — proxied by Vite under /api, exposed for curl
      # The browser sidecar shares this container's network namespace (see `browser` below),
      # so its port is published here rather than on its own service.
      - "9746:9746" # browser-mcp — MCP endpoint, noVNC and the web UI
    environment:
      # 8080 is the production default but is taken by ttyd in this environment;
      # vite.config.ts proxies /api to 8081 to match.
      TOUCHSTONE_PORT: "8081"
      # The Beacon aggregator runs in the claude-code container and publishes 3000 on the
      # host; `localhost` inside this container is this container. Without this the
      # in-process importer cannot reach Docmost at all — and it failed silently for as long
      # as a cached roll-up was there to read instead, which is how a thirteen-day-old
      # snapshot passed for a live feed.
      TOUCHSTONE_BEACON_URL: "http://host.docker.internal:3000/mcp/"
      # Filesystem events do not propagate reliably across a Windows bind mount,
      # so the watchers poll instead of relying on inotify.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    # node_modules is already populated in the bind mount and this is a linux
    # x64 container like the one that installed it, so install is a no-op unless
    # package.json changed.
    command: sh -c "yarn install --frozen-lockfile && yarn dev"
    restart: unless-stopped

  # ── the browser, for the functional leg ─────────────────────────────────────
  # Touchstone's own instance, not the shared box-wide `browsermcp`. That browser is busy
  # with other work — n8n's PR Review drives it too — and an audit whose tab was stolen
  # mid-install records the theft against the app. ARCHITECTURE.md §2.4 and §5.4.
  #
  # Copied from Newsdesk's stack with ONE deliberate divergence: **no profile volume**.
  # Newsdesk keeps `/data/chrome-profile` because a warm signed-in session is the point
  # there. Here it is unsafe: the functional protocol asks whether the app has an auth gate,
  # and a session cookie surviving from a previous assay makes an unprotected app look
  # protected — a false pass on the check that catches auth bypass.
  browser:
    # 1.1.5 is a floor, not a preference: the tab registry (/api/pages), `hover`, and the
    # per-tab screencast all arrive in it.
    image: ghcr.io/worph/browser-mcp:1.1.5
    container_name: touchstone-browser
    restart: unless-stopped
    # Chrome crashes on the 64M default.
    shm_size: "2gb"
    environment:
      VNC_RESOLUTION: "1440x900x24"
      MCP_PORT: "9746"
      # Reap Chrome between runs. Nothing is kept, so a cold start costs nothing but time.
      IDLE_TTL_MS: "900000"
      # Sweep tabs nobody owns. The runner closes its own on release, so anything still
      # here after half an hour is a leak.
      PAGE_COLLECTOR: "on"
      PAGE_TTL_MS: "1800000"
    # ── why it shares the dev container's network namespace ────────────────────────────
    # A service worker — and therefore web push — only exists in a **secure context**:
    # https, or http on localhost / 127.0.0.1 / [::1]. On its own network this container
    # could reach the UI only as `172.19.0.1:5173` or `host.docker.internal:5173`, neither of
    # which Chrome trusts, so `navigator.serviceWorker` was simply undefined and the Enable
    # button on the Activity page did nothing at all — silently.
    #
    # Sharing the namespace makes `http://localhost:5173` inside Chrome the real Vite server
    # and `localhost:8081` the real API, both trustworthy, with no Chrome flags. The image
    # hard-codes its Chrome argv and reads no extra-args env, so
    # `--unsafely-treat-insecure-origin-as-secure` is not reachable from out here.
    #
    # Dev only. The packaged stack puts every service on `pcs` and serves over https.
    network_mode: "service:dev"
    depends_on:
      - dev

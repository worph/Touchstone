id: functional-v2
name: Functional Review Protocol
version: 2
leg: functional

# As with the static leaf, the rubric lives in Docmost and the agent reads it at run time.
# Touchstone holds the pointer and the version only.
#
# The phase letters — A, C, D, E8, E9, E10, F, G — are the protocol's own vocabulary and are
# still parsed out of the report's phase table by `parsePhases`, because that table is how a
# run says whether it happened at all. A phase that could not run is not a finding: the
# assay carries `status: blocked` and no verdict, since a blocked run is a statement about
# the bench and never about the subject.

source:
  orchestrator: In2NAGjv0h
  protocol: 7HxjTwe63H

# The protocol has no functional-only mode: `full` runs both leaves in one pass and the
# response is split into two assays (ARCHITECTURE.md §1.3, and P5 of the plan).
depth: full

# Bench selection is Touchstone's, not the agent's. The demo management board reports a host
# as Ready while its credentials are being rejected — that is the 2026-08-05 failure mode —
# so the board supplies discovery and the /api/firstfactor probe supplies truth.
bench:
  board: https://app.nasselle.com/demo/admin/manage
  min_time_remaining_minutes: 60

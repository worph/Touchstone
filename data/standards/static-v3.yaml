id: static-v3
name: Static Review Protocol
version: 3
leg: static

# Rule vocabulary for the static leg.
#
# Two kinds of code live here.
#
#   D1–D5 are the *existing* deviation-table rules. The audit reports already cite them by
#   code, so they are transcribed, not invented, and their wording follows the reports.
#
#   Everything else is defined here for the first time. The reports state these findings in
#   prose — "thumbnail.png is a byte-identical copy of icon.png", "no per-volume /
#   per-environment descriptions" — with no stable identifier, which is exactly why the same
#   defect on five apps reads as five unrelated sentences instead of one row. Codes are
#   grouped by a two-letter domain prefix so they never collide with the functional leg's
#   single-letter phase codes (A, C, D, E8, E9, E10, F, G, G′).
#
#     CPU  cpu_shares tiering        PI   pre/post-install commands
#     AS   store assets              PM   permission strategy, beyond D1–D5
#     DC   documentation             SEC  security posture
#     IM   image pinning             MD   compose / x-casaos metadata
#     PS   persistence and volume placement
#
# `severity` is the default applied when a report states the finding without one; a severity
# written in the report always wins. `match` and `exclude` are consumed only by
# tools/import.ts to normalise prose onto a code — the server never reads them.
#
# Adding a code is cheap and safe. Findings whose text matches nothing are still imported,
# under a synthetic `x:<slug>` code, so the long tail stays visible and the frequent members
# of it can be promoted into this file later.

rules:
  # ── Permission strategy: the pre-existing deviation table ────────────────────────────
  - code: D1
    title: root container, AppData-only
    severity: minor
    description: >-
      Runs as root but touches nothing outside the app's own /DATA/AppData subtree.
      Rationale recommended, not required — this is a pass in the deviation table.
    match:
      - 'rule\s*\*{0,2}D1'
      - 'D1\b.{0,40}(root, ?AppData-only|AppData[- ]only)'

  - code: D2
    title: root container with user-directory access, no rationale.md
    severity: major
    description: >-
      Runs as root *and* mounts a user directory (/DATA/Downloads, /DATA/Media, whole-/DATA,
      the Docker socket). The deviation table requires a rationale.md; missing one is Major.
    match:
      - 'rule\s*\*{0,2}D2'
      - '\bD2\b'
      - 'root container with user-directory access'

  - code: D3
    title: documented deviation, rationale.md present
    severity: none
    description: A deviation from the permission strategy that is documented in rationale.md.
    match:
      - 'rule\s*\*{0,2}D3'

  - code: D4
    title: '$PUID:$PGID within /DATA — no rationale required'
    severity: none
    description: >-
      Runs as $PUID:$PGID with access confined to /DATA. The deviation table makes this a
      pass whatever the mount layout, so it is recorded to prove the rule was applied.
    match:
      - 'rule\s*\*{0,2}D4'
      - '\bD4\b'

  - code: D5
    title: privileged / cap_add / device access without rationale.md
    severity: critical
    description: >-
      privileged:true, cap_add, /dev passthrough or host networking. Undocumented privilege
      escalation is Critical; with a rationale.md it drops to a documented deviation.
    match:
      - 'rule\s*\*{0,2}D5'
      - '\bD5\b'
      - 'undocumented privilege escalation'
      - 'cap_add.{0,40}(no|missing) ?rationale'

  # ── cpu_shares ───────────────────────────────────────────────────────────────────────
  # Three distinct defects hide behind one checklist item ("cpu_shares is set appropriately
  # on all services"), and they have different fixes and different owners, so they get three
  # codes. CPU2 in particular is the one that clusters: the reserved tier is a convention
  # that gets copy-pasted across a family of apps, and it is invisible until grouped.
  - code: CPU1
    title: cpu_shares missing on one or more services
    severity: minor
    description: The field is absent, not merely mis-tiered. Fix is to add it at service top level.
    match:
      - 'cpu_shares[^.\n]{0,60}\b(missing|not set|absent|no cpu_shares|zero cpu_shares)'
      - '(missing|not set|absent)[^.\n]{0,40}cpu_shares'
      - 'compose contains zero `?cpu_shares'
    exclude:
      - 'cpu_shares:? ?`?\d'
    supersedes: [CPU3]

  - code: CPU2
    title: cpu_shares on reserved tier 10
    severity: minor
    description: >-
      cpu_shares is present but set to 10, which CONTRIBUTING reserves for
      "System Background (Reserved)" — system maintenance tasks. Any user-facing service on
      that tier is starved by design. Almost always a family-wide copy-paste rather than a
      per-app slip, which is the reason this needs a code of its own.
    match:
      - 'cpu_shares:? ?`?\*{0,2}10\b'
      - 'cpu_shares[^.\n]{0,80}(reserved|System.?Background)'
      - '(reserved|System.?Background)[^.\n]{0,80}cpu_shares'
    supersedes: [CPU1, CPU3]
    family:
      # Captures a sibling list from a sentence such as "this is a family-wide convention —
      # Radarr, Sonarr, Lidarr and qBittorrent all ship cpu_shares: 10". The importer emits
      # the finding on each named sibling as `unverified`, never as an observed fail.
      - '(?:family[- ]wide convention|repo-wide[^.\n]{0,20}convention)[^.\n]*?[—:-]\s*([A-Za-z0-9, ]+?(?:and |& )?[A-Za-z0-9]+)\s+(?:are )?all (?:ship|are)'
      - '\(([A-Za-z0-9]+(?:, [A-Za-z0-9]+)+,? (?:and |& )?[A-Za-z0-9]+) are all ?`?10'

  - code: CPU3
    title: cpu_shares set to an undocumented or wrong tier
    severity: minor
    description: >-
      Present, not 10, but not a value from the published CPU Share Allocation table, or a
      table value that does not match the service's role.
    match:
      - 'cpu_shares[^.\n]{0,80}(not a defined tier|undocumented tier|wrong tier|below the documented|off the published)'
      - 'cpu_shares:? ?`?\d+[^.\n]{0,60}(tier|Allocation)'
      # Fallback: a checklist item whose *title* is about cpu_shares but which names no
      # value. The item failed for some tiering reason the report states only in prose.
      - '^[^\n]*cpu_shares'

  # ── Store assets ─────────────────────────────────────────────────────────────────────
  - code: AS1
    title: thumbnail.png missing
    severity: major
    description: >-
      CONTRIBUTING lists thumbnail.png as a Required file — it is the store tile. Absent
      entirely, or the x-casaos.thumbnail URL 404s.
    match:
      - 'thumbnail\.png[^.\n]{0,40}(missing|absent|does not exist|404)'
      - '(missing|no|required)[^.\n]{0,30}thumbnail\.png'
    exclude:
      - 'reuses|duplicat|byte-identical|copy of'

  - code: AS2
    title: thumbnail.png is a duplicate of icon.png
    severity: minor
    description: >-
      The tile and the icon are the same bytes, so the store listing has no distinct tile.
      Separate from AS3 because the fix differs — one is a resize, the other a new asset.
    match:
      - 'thumbnail[^.\n]{0,60}(copy of|duplicate of|byte-identical to|duplicates|reuses)[^.\n]{0,20}icon'
      - 'thumbnail[^.\n]{0,40}points at[^.\n]{0,20}icon\.png'

  - code: AS3
    title: thumbnail.png is a duplicate of screenshot-1.png
    severity: minor
    description: The tile reuses the first screenshot instead of shipping a tile-shaped asset.
    match:
      - 'thumbnail[^.\n]{0,60}(copy of|duplicate of|duplicates|reuses|reusing)[^.\n]{0,20}screenshot'

  - code: AS4
    title: required screenshot or icon asset missing
    severity: major
    description: A Required asset other than the thumbnail is absent from the app directory.
    match:
      - '(screenshot-\d\.png|icon\.png)[^.\n]{0,40}(missing|absent|404)'
      - 'missing[^.\n]{0,40}(screenshot|required store assets)'

  - code: AS5
    title: asset URL broken or pointing outside this repository
    severity: major
    description: >-
      x-casaos asset URLs must resolve and must point at Yundera/AppStore, not a contributor
      fork or an external host.
    match:
      - 'broken[^.\n]{0,30}asset'
      - 'asset URL[^.\n]{0,40}(broken|404|fork|does not resolve)'

  - code: AS6
    title: assets do not meet the published dimension specs
    severity: minor
    description: Icon/thumbnail/screenshot pixel dimensions differ from the published spec.
    match:
      - '(icon|thumbnail|screenshot)[^.\n]{0,80}(dimension specs?|do not meet the published)'
      - 'meet specifications'

  # ── Documentation ────────────────────────────────────────────────────────────────────
  - code: DC1
    title: no volume/env descriptions
    severity: minor
    description: >-
      x-casaos carries no per-volume `volumes:` or per-variable `envs:` description entries,
      so the store UI tells the user nothing about what a mount or a variable does. The most
      common finding in the corpus, and a store-wide convention gap rather than an app bug —
      which is precisely the argument the grouped view has to be able to make.
    match:
      - '(volume|per-volume)[^.\n]{0,40}(and|/)[^.\n]{0,30}(environment|env)[^.\n]{0,30}descriptions?'
      - 'no (per-)?volume[^.\n]{0,60}description'
      - 'volume/env descriptions'
      - 'x-casaos volume/env descriptions'

  - code: DC2
    title: rationale.md missing where required
    severity: major
    description: >-
      CONTRIBUTING names the cases that require a rationale.md — disabled auth, reliance on
      first-launch onboarding, published host ports, deviations from the permission strategy
      — and none is present. Distinct from D2/D5, which are the *permission* deviations
      specifically; this covers the rest.
    match:
      - 'missing[^.\n]{0,40}rationale\.md'
      - 'rationale\.md[^.\n]{0,30}(missing|absent|not present|404)'
      - 'no `?rationale\.md'
      - 'authentication exception is undocumented'
    exclude:
      - 'rule\s*\*{0,2}D[25]'

  - code: DC3
    title: rationale.md does not cover the actual deviations
    severity: major
    description: A rationale.md exists but omits or misdescribes what the compose actually does.
    match:
      - 'rationale\.md[^.\n]{0,60}(does not cover|misdescribes|omits|incomplete)'

  - code: DC4
    title: application description missing or incomplete
    severity: minor
    description: Missing locales, missing mandatory en_us title, or a description that omits material behaviour.
    match:
      - 'description[^.\n]{0,40}(omits|missing|incomplete|inadequate)'
      - '(missing|no)[^.\n]{0,30}(clear )?description of the application'

  - code: DC5
    title: documentation is stale or misleading
    severity: minor
    description: >-
      tips/before_install advertising credentials or features that no longer match the
      shipped version.
    match:
      - 'stale version-specific documentation'
      - 'misleading auth documentation'
      - 'documentation[^.\n]{0,30}(stale|out of date|no longer)'

  # ── Image pinning ────────────────────────────────────────────────────────────────────
  - code: IM1
    title: main served image is unpinned
    severity: major
    description: The image behind x-casaos.main uses :latest or no tag at all.
    match:
      - '(main|served)[^.\n]{0,40}image[^.\n]{0,40}(:latest|unpinned|no tag)'
      - ':latest[^.\n]{0,30}main image'

  - code: IM2
    title: helper or pre-install image is unpinned
    severity: minor
    description: >-
      A sidecar, or an image invoked from a pre/post-install command, uses :latest or a bare
      name that Docker resolves to :latest (`alpine`).
    match:
      - '(helper|sidecar|pre-install)[^.\n]{0,60}(unpinned|:latest|rolling)'
      - 'unpinned[^.\n]{0,30}(helper|sidecar) image'
      - 'bare `?alpine`?'
      - 'specific version tag on all images'

  # ── Pre/post-install commands ────────────────────────────────────────────────────────
  - code: PI1
    title: pre-install command writes a user directory without --user $PUID:$PGID
    severity: minor
    description: >-
      mkdir into /DATA/Media or /DATA/Downloads as root leaves root-owned directories that
      the $PUID:$PGID container cannot write.
    match:
      - 'pre-install[^.\n]{0,80}(--user|user directories with no|permissions)'
      - 'pre-install-cmd writes a user directory'
      - 'pre-install command permissions'

  - code: PI2
    title: pre-install command is not idempotent
    severity: major
    description: Re-running the install mutates or destroys state.
    match:
      - 'pre-install[^.\n]{0,40}idempoten'
      - 'idempoten[^.\n]{0,40}pre-install'

  - code: PI3
    title: pre-install command hardcodes a uid/gid
    severity: minor
    description: Literal 1000:1000 instead of $PUID:$PGID.
    match:
      - 'pre-install-cmd hardcodes'
      - 'hardcodes \d+:\d+'

  # ── Permission strategy, beyond the deviation table ──────────────────────────────────
  - code: PM1
    title: 'service declares no explicit user:'
    severity: minor
    description: >-
      The Permission Strategy requires an explicit `user:` on every service; one or more
      omit it and inherit whatever the platform gives them.
    match:
      - 'no explicit `?user:'
      - '(omits|declares neither|declares no)[^.\n]{0,40}`?user:'
      - 'no user identity'
      - 'omits the mandatory explicit `?user:'

  - code: PM2
    title: PUID/PGID environment variables not set
    severity: minor
    description: >-
      `user:` is set but the PUID/PGID variables the image documents are not. Note the
      guideline contradicts its own examples here — several reports flag it as advisory.
    match:
      - 'PUID[/ ]?(and )?[/ ]?PGID[^.\n]{0,40}(not set|absent|neither)'
      - 'neither `?user:`? nor `?PUID'

  # ── Security ─────────────────────────────────────────────────────────────────────────
  - code: SEC1
    title: no authentication gate enabled or documented
    severity: critical
    description: >-
      The Security Checklist makes an enabled, documented authentication method mandatory.
      Statically: no sidecar, no basic auth, and the app's own auth defaults to off. When a
      run confirms it live it is the same defect as functional phase E9.
    match:
      - 'authentication (method )?(is )?(enabled and documented|enabled|not enabled)'
      - 'no auth(entication)? (layer|gate|method)'
      - 'auth(entication)? (is )?(disabled|bypassable)'

  - code: SEC2
    title: hardcoded credentials in the compose file
    severity: major
    description: A literal password, token or key in `environment:` rather than a platform variable.
    match:
      - 'hardcoded credentials'
      - 'password is written inline'
      - 'literal password'

  - code: SEC3
    title: host ports published without rationale
    severity: major
    description: A service publishes `ports:` on the host rather than staying on the pcs network.
    match:
      - 'publishes host ports'
      - 'host ports[^.\n]{0,40}rationale'
      - 'declares `?ports:'

  - code: SEC4
    title: exposed admin surface
    severity: major
    description: An administrative interface reachable from the public vhost.
    match:
      - 'security posture of the exposed admin surface'
      - 'exposed admin surface'

  # ── Persistence and volume placement ─────────────────────────────────────────────────
  - code: PS1
    title: app state not mapped under /DATA/AppData
    severity: critical
    description: >-
      The static persistence cross-check found a state location the compose does not map, so
      a reinstall silently loses data. Critical because the loss is irreversible and silent.
    match:
      - 'state not mapped'
      - 'not mapped under `?/DATA/AppData'
      - 'unmapped state'
      - 'static persistence check[^.\n]{0,40}(fail|FAIL)'

  - code: PS2
    title: volumes outside the app's /DATA/AppData subtree with no rationale
    severity: major
    description: >-
      Mounts that leave the app's own subtree — another app's AppData, whole-/DATA, a host
      path — without a rationale.md documenting why.
    match:
      - 'volumes? outside[^.\n]{0,40}/DATA'
      - 'data mapped outside /DATA'
      - 'cross-app data-erasure'

  # ── Compose / x-casaos metadata ──────────────────────────────────────────────────────
  - code: MD1
    title: compose name fails the required regex
    severity: major
    description: '`name` must match ^[a-z0-9][a-z0-9_-]*$ and agree with store_app_id.'
    match:
      - 'name[^.\n]{0,30}regex'

  - code: MD2
    title: required x-casaos metadata missing
    severity: major
    description: A mandatory x-casaos key (webui_port, main, index, architectures) is absent.
    match:
      - 'missing `?x-casaos\.'
      - 'x-casaos[^.\n]{0,30}(missing|absent)'
      - 'webui_?port'

  - code: MD3
    title: sidecar or network wiring is inconsistent
    severity: major
    description: >-
      A declared sidecar is unreachable, on the wrong network, or its environment set is
      incomplete — the compose does not describe a working system.
    match:
      - 'unreachable[^.\n]{0,40}(sidecar|network)'
      - 'sidecar is on a different network'
      - 'OIDC env set is incomplete'
      - 'AUTH_HASH[^.\n]{0,40}(absent|without)'

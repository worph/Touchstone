id: static-v4
name: Static Review Protocol
version: 4

# v4 (2026-08-20) — the CasaOS -> Maison switch. The rubric itself did not move: Maison
# consumes the unmodified store format, so an app carrying only `x-casaos` is still correct.
# What v4 adds is the compose extension Maison reads alongside it (`x-compose-app`) — the
# `declared-folders` item, the `webui-host`/Caddy-label agreement, and the quoted-`mode` trap
# that makes an install fail outright. See `protocols/static.md` §D.
leg: static

# The rubric itself lives in Docmost and is fetched by the assay agent at run time — the
# orchestrator composes it, and the agent is instructed to read the dated Amendment section
# as binding. Touchstone does not hold a copy: a second copy is a second thing to drift.
#
# What it holds is the *pointer* and the *version*, because every assay records which
# version judged it (ARCHITECTURE.md principle 6) and a verdict without a rubric version is
# not durable.
#
# This file used to carry a 35-rule vocabulary with regex matchers, used to normalise report
# prose into finding rows. That went with findings-as-rows (ARCHITECTURE.md §1.4 G): the
# agent states its own verdict, tier and score under contract, and re-deriving them from the
# body is what promoted four Critical apps to `compliant`.

source:
  # Read via docmost-mcp__get_page through Beacon.
  orchestrator: In2NAGjv0h
  protocol: LPwfKYUVig

# Passed to the runner as `depth` (P4). The static leg needs no bench and no browser.
depth: static

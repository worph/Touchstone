name: Build and Push Docker Image

# Produces ghcr.io/worph/touchstone. `latest` follows main; a `vX.Y.Z` tag additionally
# produces X.Y.Z and X.Y, and every build is retrievable by its commit sha.
#
# The AppStore compose pins an exact version rather than `latest` — a store app that floats
# would change under an operator between two identical installs — so cutting a release means
# pushing a tag here and then bumping the image in Apps/Touchstone/docker-compose.yml.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the image (optional, defaults to sha)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      # Gate the image on the suite. The rubric is data rather than code, but the frontmatter
      # contract, the scheduler policy port and the trial isolation are all covered here, and
      # an image that fails them should never reach a box that audits other people's apps.
      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          # The AppStore requires both, which is also why nothing here has a native
          # dependency — no SQLite, no node-gyp, so arm64 is a plain cross-build.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
